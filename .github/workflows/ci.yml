name: CI project tasks management API

on:
  push:
    branches: [ "main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mi_base_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        # Esto asegura que el pipeline espere a que Postgres esté listo para recibir conexiones
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
  
    steps:
  
    - name: clone code repository
      uses: actions/checkout@v4
  
    - name: get python ready
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
  
    - name: install libraries or dependencies and other neccesary things
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
  
    - name: run python test
      run: python -m compileall .
      
    - name: run ruff test
      run: ruff check .
  
    - name: run unit tests and API tests
      run: python -m pytest
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/mi_base_test
        SECRET_KEY: askfgjdgasdfgkgasdkhfhjfgsdakhgasdhfjhasdgfjdafvgasdfhjhsafsjdsdavfokmasvbfkasdvfafiopj

    - name: run Docker compose to check
      env:
        SECRET_KEY: ${{secrets.SECRET_KEY}}
        POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
        ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
      run: docker compose up --build -d

    - name: Esperar y verificar docker compose
      run: |
        echo "Esperando a que la API responda a través del reverse proxy..."
        
        # Intentamos hacer un curl que imprima el código HTTP (-o /dev/null -w "%{http_code}")
        # Esto nos dirá exactamente qué número devuelve Caddy
        for i in {1..10}; do
          RESPONSE=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/ || echo "FALLO_CONEXION")
          echo "Intento $i: Código HTTP recibido -> $RESPONSE"
          
          if [ "$RESPONSE" = "200" ]; then
            echo "¡Éxito! La API respondió con 200 OK."
            exit 0
          fi
          
          sleep 3
        done
    
        echo "❌ La API no respondió correctamente tras varios intentos. Mostrando logs:"
        docker compose logs
        exit 1