services:
  db:
    image: postgres:15-alpine
    container_name: taskforge_postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=taskforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskforge_db"]
      interval: 3s
      timeout: 3s
      retries: 5
  web:
    build: .
    container_name: taskforge_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/taskforge_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully
  tests:
    build: .
    container_name: taskforge_test
    volumes:
      - .:/app
    command: python -m pytest && python -m compileall . && ruff check .
    depends_on:
      db:
        condition: service_healthy
  migrations:
    build: .
    container_name: alembic_migrations
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/taskforge_db
      - SECRET_KEY=${SECRET_KEY}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: