services:
  db:
    image: postgres:15-alpine
    container_name: taskforge_postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=taskforge_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskforge_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  reverse_proxy:
    container_name: caddy_container
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - caddy_data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - web

  # 1. El servicio principal construye la imagen y le asigna un nombre (tag)
  web:
    build: .
    image: taskforge_app:latest  # <--- Asignamos un nombre oficial a la imagen
    container_name: taskforge_api
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/taskforge_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully

  # 2. Reciclamos la imagen creada por 'web' para correr las pruebas
  tests:
    image: taskforge_app:latest  # <--- Reutilizamos la misma imagen (sin 'build:')
    container_name: taskforge_test
    volumes:
      - .:/app  # Mantenemos el volumen para desarrollo local si lo deseas
    command: python -m pytest && python -m compileall . && ruff check .
    depends_on:
      db:
        condition: service_healthy

  # 3. Reciclamos la misma imagen para aplicar las migraciones de Alembic
  migrations:
    image: taskforge_app:latest  # <--- Reutilizamos la misma imagen (sin 'build:')
    container_name: alembic_migrations
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/taskforge_db
      - SECRET_KEY=${SECRET_KEY}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data: